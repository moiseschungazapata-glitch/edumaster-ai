[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edumaster-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3", "alembic>=1.13,<2", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
ml = ["torch>=2.5,<3", "scikit-learn>=1.5,<2", "mlflow>=2.15,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
